[package]
name = "iphost"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"

authors = ["Menhera.org Developers"]
description = "Stable hostname resolution library that supports storing a hostname as either a static IP address or an FQDN."
license = "Apache-2.0 OR MPL-2.0"
readme = "README.md"
repository = "https://github.com/metastable-void/iphost"

[features]
default = ["serde", "tracing", "broadcast"]
serde = ["dep:serde"]
tracing = ["dep:tracing"]
broadcast = ["dep:tokio"]
custom = ["dep:socket2", "dep:libc", "dep:windows-sys"]
ra = ["custom"]
dhcpv6 = ["custom"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["sync"], optional = true }
tracing = { version = "0.1", optional = true }
fqdn = { version = "0.5", features = ["domain-label-length-limited-to-63", "domain-name-length-limited-to-255", "domain-name-without-special-chars", "domain-label-cannot-start-or-end-with-hyphen", "punycode"] }
serde = { version = "1", features = ["derive"], optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper"], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
